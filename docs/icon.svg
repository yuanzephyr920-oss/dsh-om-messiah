<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#3a2c12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12100c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="45%" stop-color="#f2d489"/>
      <stop offset="100%" stop-color="#d8a94a"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- gear ring -->
  <g stroke="#d8a94a" fill="none">
    <circle cx="256" cy="256" r="178" stroke-width="18"/>
    <circle cx="256" cy="256" r="146" stroke-width="3" stroke-dasharray="10 12" opacity="0.75"/>
  </g>
  <g fill="#d8a94a">
    <g id="teeth">
      <rect x="246" y="52" width="20" height="34" rx="5"/>
      <rect x="246" y="426" width="20" height="34" rx="5"/>
      <rect x="52" y="246" width="34" height="20" rx="5"/>
      <rect x="426" y="246" width="34" height="20" rx="5"/>
    </g>
    <use href="#teeth" transform="rotate(30 256 256)"/>
    <use href="#teeth" transform="rotate(60 256 256)"/>
  </g>

  <!-- candle -->
  <g>
    <rect x="228" y="292" width="56" height="112" rx="14" fill="#eadfc4"/>
    <rect x="228" y="292" width="56" height="16" rx="8" fill="#f7efd9"/>
    <path d="M256 296c-4-16-22-26-22-46 0-16 10-28 22-38 12 10 22 22 22 38 0 20-18 30-22 46z"
          fill="url(#flame)" opacity="0.98"/>
    <path d="M256 292c-2-10-12-16-12-28 0-9 6-16 12-21 6 5 12 12 12 21 0 12-10 18-12 28z"
          fill="#fff8e2"/>
  </g>

  <!-- Ω above the flame -->
  <path d="M228 214v-12a34 34 0 1 1 56 0v12M208 214h32M272 214h32"
        fill="none" stroke="#f2d489" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
